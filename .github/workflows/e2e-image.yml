name: E2E Image

# Runs reachability inside the Docker image built from this commit, so a missing
# or broken toolchain fails here rather than in a user's pipeline. e2e-test.yml
# covers reachability run directly on the runner.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/docker-entrypoint.sh"
      - "socketsecurity/core/tools/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/docker-entrypoint.sh"
      - "socketsecurity/core/tools/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    # Needs SOCKET_CLI_API_TOKEN, which fork and Dependabot PRs don't get.
    if: >-
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: e2e-image-reachability
    env:
      IMAGE: socket-python-cli:e2e
      FIXTURES: simple-npm simple-cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One build for every fixture: the image is by far the most expensive
      # part of this job.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            USE_LOCAL_INSTALL=true
          # Read-only: reuse the release build's toolchain layers without
          # writing this commit's layers back.
          cache-from: type=registry,ref=socketdev/cli:buildcache

      - name: Run reachability in the image
        id: run-cli
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: |
          # The checkout belongs to the runner user and the container runs as
          # root, so git needs the mount marked safe to read repository details.
          # The named volume keeps the downloaded reachability engine across
          # runs.
          in_image() {
            docker run --rm -v "$PWD:/repo" -w /repo \
              -v socket-cache:/root/.cache/socket \
              -v /tmp/e2e-logs:/tmp/e2e-logs \
              -e SOCKET_SECURITY_API_KEY \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              "$@"
          }
          export -f in_image
          mkdir -p /tmp/e2e-logs

          # Every fixture runs even when an earlier one fails, so one failure
          # can't hide another.
          failed=""
          for fixture in $FIXTURES; do
            target="tests/e2e/fixtures/$fixture"
            log="/tmp/e2e-logs/$fixture.log"
            echo "::group::$fixture"
            if bash tests/e2e/run-with-retries.sh "e2e-image-$fixture" \
                "in_image --entrypoint python $IMAGE tests/e2e/reach_facts.py $target --probe" \
                in_image "$IMAGE" --target-path "$target" --reach --disable-blocking --enable-debug; then
              cp /tmp/e2e-output.log "$log"
              in_image --entrypoint python "$IMAGE" tests/e2e/reach_facts.py "$target" --validate-analyzed "$log" \
                || failed="$failed $fixture"
            else
              cp /tmp/e2e-output.log "$log"
              echo "FAIL: the CLI exited with an error for $fixture"
              failed="$failed $fixture"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=e2e-image-reachability::failed for:$failed"
            exit 1
          fi

      - name: Upload diagnostics
        if: failure() || steps.run-cli.outputs.diagnostics == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-diagnostics-attempt${{ github.run_attempt }}
          path: |
            /tmp/e2e-logs/
            tests/e2e/fixtures/*/.socket.facts.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
