name: Mark Release as Stable
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to mark as stable (e.g., 1.2.3)'
        required: true

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker publishing
        uses: $/.github/actions/setup-docker
        with:
          # Retagging copies manifests between tags; nothing is built.
          enable-qemu: "false"
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stable must be the release's exact digest, attestations included.
      - name: Tag the release image as stable
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+(\.[0-9A-Za-z-]+)+$'; then
            echo "Error: '${INPUT_VERSION}' is not a release version such as 1.2.3"
            exit 1
          fi
          docker buildx imagetools create --tag socketdev/cli:stable "socketdev/cli:${INPUT_VERSION}"
