repos:
  - repo: local
    hooks:
      - id: sync-version
        name: Sync __version__ with hatch version
        entry: python .hooks/sync_version.py
        language: python
        always_run: true
        pass_filenames: false

      # Use the project's locked Ruff version, shared with CI and make lint.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --extra dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
