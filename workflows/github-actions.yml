# Socket Security pull request scan.
#
# Copy to .github/workflows/ and make the `socket-security` job a required status
# check. Keep that job name exclusive to this workflow: GitHub counts a skipped
# job as passing, so another workflow reporting the same name could satisfy the
# check without scanning the pull request.
#
# Companion workflows: github-actions-push.yml keeps the default-branch baseline
# current, and github-actions-comments.yml (optional) handles ignore commands.
name: Socket Security Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: socket-security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  socket-security:
    name: socket-security
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      issues: write # post the Socket comments and react to ignore commands
      pull-requests: write # read the pull request and update its comments
    # `latest` keeps this template current with every release. For reproducible
    # runs, pin a release tag and digest instead, for example
    # socketdev/cli:2.14.0@sha256:<digest>, and update it when you upgrade.
    container: socketdev/cli:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the Socket pull request scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "$PR_NUMBER"
