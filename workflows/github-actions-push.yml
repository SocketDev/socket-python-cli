# Socket Security push scans.
#
# Copy to .github/workflows/ alongside github-actions.yml. Default-branch scans
# are the baseline pull request comparisons run against, so without this
# workflow those comparisons use an increasingly old scan. Push scans never
# block; they report to the Socket Dashboard.
name: Socket Security Pushes

on:
  push:
    branches: ['**']

permissions: {}

concurrency:
  group: socket-security-push-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  socket-security-push:
    name: socket-security-push
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    # Pinning: see the image comment in github-actions.yml.
    container: socketdev/cli:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the Socket push scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number 0
