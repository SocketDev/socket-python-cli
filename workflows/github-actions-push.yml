# Copy this workflow to .github/workflows/ to scan pushes and update the baseline.
name: Socket Security Pushes

on:
  push:
    branches: ['**']

concurrency:
  group: socket-push-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  socket-security-push:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: socketdev/cli:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Socket Security Push Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number 0
