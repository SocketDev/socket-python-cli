# Copy this workflow to .github/workflows/ to handle PR ignore commands.
name: Socket Security Ignore Commands

on:
  issue_comment:
    types: [created]

concurrency:
  group: socket-ignore-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  socket-security-ignore:
    if: github.event.issue.pull_request
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    container: socketdev/cli:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Handle Socket Security Ignore Commands
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "$PR_NUMBER"
