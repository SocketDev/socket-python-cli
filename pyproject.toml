[build-system]
requires = [
  "hatchling==1.33.0"
]
build-backend = "hatchling.build"

[project]
name = "socketsecurity"
version = "2.12.1"
requires-python = ">= 3.11"
license = {"file" = "LICENSE"}
dependencies = [
    "requests==2.34.2",
    "mdutils==1.8.1",
    "prettytable==3.18.0",
    "gitpython==3.2.1",
    "packaging==26.3",
    "python-dotenv==1.2.4",
    "socketdev==3.6.2",
    "beautifulsoup4==4.15.0",
    "markdown==3.11.3",
    "brotli==1.2.1; platform_python_implementation == 'CPython'",
    "brotlicffi==1.2.1.0; platform_python_implementation != 'CPython'",
    # requests' CA bundle. A floor rather than an exact pin, so later trust-store
    # fixes still reach installs; 2026.10.19 drops the roots behind the
    # compromised eMudhra intermediates.
    "certifi>=2026.10.19",
]
readme = "README.md"
description = "Socket Security CLI for CI/CD"
keywords = ["socketsecurity", "socket.dev", "sca", "oss", "security"]
authors = [
    {name = "Douglas Coburn", email = "douglas@socket.dev"}
]
maintainers = [
    {name = "Douglas Coburn", email = "douglas@socket.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-watch==4.2.0"
]
dev = [
    "ruff==0.17.4",
    "twine==7.0.0", # for building
    "uv==0.13.7",  # for dependency management
    "pre-commit==4.7.0",
    "hatch==1.18.2"
]

[project.scripts]
socketcli = "socketsecurity.socketcli:cli"
socketclidev = "socketsecurity.socketcli:cli"

[project.urls]
Homepage = "https://socket.dev"

[tool.coverage.run]
source = ["socketsecurity"]
branch = true
include = [
    "socketsecurity/**/*.py",
    "socketsecurity/**/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

[tool.ruff]
# The formatter owns physical layout. E501 and W291/W293 are unselected:
# whitespace inside help text, log messages, and Markdown strings is content.
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = [
    # --- Baseline correctness -------------------------------------------
    "E4",      # pycodestyle: import formatting
    "E7",      # pycodestyle: statement-level errors
    "E9",      # pycodestyle: syntax/IO errors
    "W605",    # invalid escape sequence in a string literal
    "F",       # Pyflakes: undefined names, unused imports, star imports
    "I",       # isort: deterministic import order
    "PLE",     # Pylint errors: unambiguous bugs, never style

    # --- Complexity guardrails ------------------------------------------
    "C901",    # McCabe cyclomatic complexity
    "PLR0913", # too many arguments in a function definition

    # --- Bug classes that matter for a CLI shipped to other people -------
    "ASYNC",   # blocking calls inside async functions
    "B",       # bugbear: loop-variable capture, missing `raise ... from`
    "C4",      # comprehension misuse
    "DTZ",     # naive datetimes: scan timestamps must be tz-aware
    "EXE",     # shebang / executable-bit mismatches in a packaged wheel
    "FLY",     # static str.join() that should be an f-string
    "FURB",    # modern-Python refactors
    "ICN",     # conventional import aliases
    "INT",     # gettext f-string traps
    "LOG",     # logging misuse
    "PERF",    # avoidable per-iteration work
    "PIE",     # dead code and redundant constructs
    "PLW",     # Pylint warnings: unchecked subprocess, loop-var rebinding
    "RET",     # unreachable or redundant return flow
    "RSE",     # raise Exception() -- not raise Exception
    "RUF",     # Ruff-native checks (incl. RUF100, see below)
    "S",       # bandit: request timeouts, unsafe subprocess, weak randomness
    "SIM",     # simplifiable branches and context managers
    "SLOT",    # __slots__ on subclasses of str/tuple/namedtuple
    "T10",     # leftover breakpoint()/pdb.set_trace() reaching a release
    "T20",     # stray print(): stdout is a contract for a CLI, not a debug log
    "TID",     # relative imports
    "UP",      # pyupgrade: the floor is Python 3.11
    "YTT",     # incorrect sys.version comparisons

    # Individually selected because their siblings are style opinions
    # (PLR2004 magic values, PLC0415 deliberate lazy imports, TRY003
    # message length) that would cost more than they catch here.
    "PLR1714", # repeated equality comparison -> `in`
    "PLR1722", # `exit()` -> `sys.exit()`: `exit` only exists when `site` ran
    "PLR1730", # if-statement that should be min()/max()
    "PLR5501", # else-if that should be elif
    "TRY201",  # `raise` instead of re-raising the bound name

    # --- Keeping the suppressions honest --------------------------------
    "PGH",     # no blanket `# noqa` / `# type: ignore` -- codes required
    "RUF100",  # unused `# noqa` -- makes the grandfather list self-cleaning
]

ignore = [
    # Keep expected failures readable without requiring tracebacks.
    "TRY400",
    "TRY401",
    "SIM108",  # retain comments on if/else branches
    "PERF401", # retain readable loops for multi-line dictionary construction
    "S603",    # git and Coana use argument lists; shell=True remains checked
    "S607",    # git, node, and other tools intentionally resolve through PATH
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# The information glyph is deliberate UI in the PR-comment markup.
allowed-confusables = ["ℹ"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Existing over-limit functions have explicit suppressions. Split new functions
# that exceed the limit; RUF100 rejects suppressions that become unnecessary.
max-complexity = 12

[tool.ruff.lint.pylint]
# Allow ordinary CLI constructors while bounding argument-heavy interfaces.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests use assertions, placeholder credentials, and fixed fixture paths.
"tests/**" = [
    "S101",    # asserts are the point
    "S105",    # throwaway credentials in fixtures
    "S106",
    "S108",    # fixed temp paths in fixtures
    "T201",    # diagnostic prints; pytest captures stdout anyway
    "RUF012",  # ClassVar annotations on test-local constants are noise
]

# Developer tooling, not shipped in the wheel. stdout is their entire interface.
".hooks/**" = ["T201", "S310"]  # fetches a hardcoded PyPI JSON endpoint
"benchmarks/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["socketsecurity"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.hatch.build.targets.wheel]
include = ["socketsecurity", "LICENSE"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]
